apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpcalchub-deleter-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mpcalchub-deleter-producer
  template:
    metadata:
      labels:
        app: mpcalchub-deleter-producer
    spec:
      containers:
      - name: mpcalchub-deleter-producer
        image: mpcalchub-deleter-producer:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: mpcalc-config
